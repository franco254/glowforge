<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=glowforge.html">
    <title>GlowForge - AI Beauty Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            opacity: 0.9;
        }
        a {
            color: white;
            text-decoration: underline;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Auto-redirect to the main app
        window.location.href = 'glowforge.html';
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">✨</div>
        <h1>GlowForge</h1>
        <p>AI-Powered Virtual Beauty Makeover Platform</p>
        <div class="spinner"></div>
        <p style="font-size: 14px; margin-top: 20px;">
            Redirecting to app...<br>
            If not redirected, <a href="glowforge.html">click here</a>
        </p>
    </div>
</body>
</html>
